<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" role="img" aria-labelledby="title desc"><title id="title">Stick-breaking illustration</title><desc id="desc">A unit interval is divided into weights pi one, pi two, pi three, and a remaining tail.</desc><rect x="60" y="58" width="780" height="54" rx="4" fill="#fff" stroke="#253247" stroke-width="3"/><rect x="60" y="58" width="273" height="54" fill="#dbeafe"/><rect x="333" y="58" width="179" height="54" fill="#bfdbfe"/><rect x="512" y="58" width="109" height="54" fill="#93c5fd"/><path d="M333 58V112 M512 58V112 M621 58V112" stroke="#253247" stroke-width="2"/><g fill="#172033" font-family="Georgia,serif" font-size="25" text-anchor="middle"><text x="196" y="92">π₁</text><text x="422" y="92">π₂</text><text x="566" y="92">π₃</text><text x="730" y="92">⋯</text></g><g fill="#475569" font-family="Arial,sans-serif" font-size="18" text-anchor="middle"><text x="196" y="145">first break</text><text x="422" y="145">second break</text><text x="566" y="145">third break</text><text x="730" y="145">remaining stick</text></g><path d="M60 35V25H840V35" fill="none" stroke="#64748b" stroke-width="2"/><text x="450" y="18" fill="#475569" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">total length = 1</text></svg>